name: Build Royal Wedding Hub APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Find and extract source ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP_FILE="$(find . -type f -iname 'Royal_Wedding_Hub_App_Source.zip' -not -path './.git/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"; fi
          if [ -z "$ZIP_FILE" ]; then echo 'Upload the source ZIP to the repository root'; exit 1; fi
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          HTML_FILE="$(find extracted -type f -name index.html -print -quit)"
          if [ -z "$HTML_FILE" ]; then echo 'ZIP must contain index.html'; exit 1; fi
          mkdir -p www
          cp -R "$(dirname "$HTML_FILE")"/. www/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
      - name: Configure Android app
        run: |
          printf '{"appId":"com.royalweddinghub.app","appName":"Royal Wedding Hub","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Royal-Wedding-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
